- subject: "fix(thinking): never rewrite a requested effort silently"
  layer: fix
  upstream_pr: null
  drop: >-
    upstream logs level clamps and high-intent remaps above Debug, warns when
    it strips configuration_update items, honours a bare output_config.effort
    in the Claude->Codex translator, and orders "ultra" above "max"
  note: >-
    Four places rewrote or dropped a caller's effort with nothing visible at
    the default Info log level: clampLevel logged at Debug, the cross-family
    xhigh/max remap logged nothing, stripConfigurationUpdates was silent, and
    the Claude->Codex translator ignored output_config.effort whenever the
    request had no thinking block and sent "medium". Each now warns with the
    model, the requested effort and the applied one, or forwards the effort.
    LevelUltra joins standardLevelOrder above max so a request for "ultra" on
    a model without it clamps to max instead of failing validation.

- subject: "feat(thinking): effort-suffixed model slugs pin the upstream effort"
  layer: feat
  upstream_pr: null
  drop: >-
    upstream accepts a hyphenated effort suffix on any model id with suffix
    priority over the body, and logs the rewrite above Debug
  note: >-
    2026-09-29. Claude Code 2.1.284 with agent teams gives a subagent the
    higher of the session's effort and its definition's (anthropics/claude-code
    #80569), so a definition's effort pin does not hold. The pin moves into the
    model id: "claude-opus-5-5-medium" is "claude-opus-5-5(medium)" spelled the
    way an agent file can carry it (the harness strips "[1m]", not parentheses).
    ParseSuffix, the one split point every layer already calls, reads a trailing
    -minimal|-low|-medium|-high|-xhigh|-max when the whole id is not a
    registered model and the remainder is, so real ids such as
    gemini-3.1-pro-low and gpt-oss-120b-medium are untouched and prefixed
    clones (scoped/claude-opus-5-5-medium) keep their account pin. The two
    suffix-priority sites in apply.go warn when the body carried a different
    effort (original_value, rewritten_to; the field joins the formatter's
    allowlist), and the OAuth alias layer re-attaches a hyphen suffix in the
    caller's spelling so the log names the slug.

