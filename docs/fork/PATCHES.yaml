- subject: "fix(openai): keep tool-result images off a text-only compat upstream"
  layer: fix
  upstream_pr: null
  drop: >-
    upstream applies its input-modalities normalization to the user message
    4cd17293 relays tool-result images through
  note: >-
    v7.2.159's 4cd17293 hoists tool_result images into a following user message
    before NormalizeOpenAIToolResultsTextOnly runs, so an
    openai-compatibility model declared text-only receives the image anyway.
    Upstream's own TestOpenAICompatExecutorToolResultContentByInputModalities
    fails at v7.2.159 without this.

# ----------------------------------------------------------- locked build ---

- prefixes:
    - "lock:"
  layer: lock
  upstream_pr: null
  drop: "never"
  note: >-
    The privacy-locked build: spec and plan, the Makefile and install script,
    lockedbuild.Enabled, the egress policy and its enforcement at every
    transport and dialer, the embedded panel, the plugin refusals and the
    embedded model snapshot. These are the reason the fork exists.
