# Hand-maintained register of carried patches. `make patches` renders PATCHES.md.
#
# One entry per fork feature, per cherry-picked upstream PR, or per standalone
# commit. Every non-merge commit above the base upstream tag must be matched by
# exactly one entry; `make patches` prints the count of unannotated rows and it
# must stay at 0.
#
# Fields:
#   subject:    one exact commit subject
#   subjects:   a list of exact commit subjects (use instead of `subject`)
#   prefixes:   a list of subject prefixes this entry claims (optional).
#               An exact `subject`/`subjects` match always wins over a prefix,
#               so a single commit can be carved out of a prefix group.
#   layer:      lock | feat | fix | pick
#   upstream_pr: PR number on router-for-me/CLIProxyAPI, or null
#   drop:       the condition under which the patch leaves the stack
#   note:       free text (optional)

# ---------------------------------------------------------------- picks -----

- subjects:
    - "fix(executor): recover truncated streamed tool calls"
    - "fix(executor): keep synthesized streams alive"
    - "fix(executor): bootstrap buffered tool streams"
    - "fix(executor): stabilize synthesized stream metadata"
    - "fix(executor): validate buffered replies before streaming"
    - "fix(executor): preserve synthesized response tier"
    - "fix(executor): preserve synthesized response metadata"
    - "fix(executor): validate choices and keep tool call metadata"
    - "fix(executor): validate tool calls and keep annotations"
    - "fix(executor): preserve synthesized audio output"
    - "fix(executor): require valid bodies and tool arguments"
  layer: pick
  upstream_pr: 5338
  drop: "upstream merges #5338 (or ships an equivalent synthesized-stream fix)"
  note: >-
    kantar0's open PR, carried whole. The eleven commits are the same objects as
    the PR head, so a rebase that lands after the merge drops them cleanly.

- subjects:
    - "fix(claude): recognize model-free native thinking signatures"
    - "fix(claude): warn on unknown signature generations"
    - "fix(claude): aggregate stale-generation warnings"
    - "refactor(claude): classify unknown CAIS generations via exported helper"
    - "fix(signature): validate model-free CAIS carrier before unknown-generation classification"
    - "fix(claude): warn on unknown CAIS generations only for anchored drop decisions"
  layer: pick
  upstream_pr: 5422
  drop: "upstream merges #5422"
  note: >-
    realies' open CAIS-signature PR. Six of its eight commits are carried; the
    two later signature-container commits were not picked.

- subject: "fix(openai): reset upstream transport after local prewarm"
  layer: pick
  upstream_pr: 5566
  drop: "upstream resets the upstream transport after a synthetic local prewarm"
  note: >-
    omsd512-W's open PR. Without it a Codex Desktop subagent spawned after the
    parent thread compacted loses every tool. The PR's other commit,
    "fix(openai): preserve local prewarm context during compact replay", was
    dropped at the v7.2.159 rebase: bd03aabc (closes upstream #5631) ships the
    equivalent and more, tracking the pending synthetic prewarm id and merging
    the warm-up input into the followup instead of refusing it. Only the
    transport reset is still fork-only, so only that commit is carried.

- subject: "test(openai): subagent spawned after parent compaction keeps prewarm tools"
  layer: fix
  upstream_pr: 5566
  drop: "drop together with the #5566 pick above"
  note: "Fork-authored regression test for the behaviour #5566 fixes."

